# Layer configuration for BrightSign meta-bs
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bs"
BBFILE_PATTERN_meta-bs = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bs = "6"

LAYERDEPENDS_meta-bs = "core"
LAYERSERIES_COMPAT_meta-bs = "dunfell gatesgarth hardknott honister kirkstone langdale mickledore nanbield scarthgap"
